<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>調查 · 知識遊牧｜活動報名中心</title>

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/logo/square-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    /* 色票、字級、元件規格照 AI 中心 public/design-guideline.md（行銷頁那一套） */
    :root {
      --text: #202220;
      --text-secondary: #5a5a5a;
      --bg: #ffffff;
      --bg-alt: rgba(0, 0, 0, 0.05);
      --fg-alt: #f6f6f6;
      --line: #dcdfe3;
      --primary: #233363;
      --primary-soft: rgba(35, 51, 99, 0.08);
      --primary-link: #146C94;
      --font: Roboto, "Noto Sans TC", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --sp-1: .25rem;
      --sp-2: .5rem;
      --sp-3: 1rem;
      --sp-4: 1.5rem;
      --sp-5: 3rem;
      --sp-section: clamp(1.5rem, 4vw, 3rem);
      --radius-ctl: 6px;
      --radius-card: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      background: #f2f2f2; /* = 白底上疊 bg-alt rgba(0,0,0,.05) */
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--primary-link); }
    a:focus-visible { outline: 2px solid var(--primary-link); outline-offset: 2px; border-radius: 2px; }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 var(--sp-4);
    }
    @media (max-width: 640px) { .container { padding: 0 var(--sp-3); } }

    /* 頁首（行銷頁） */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      display: flex; align-items: center; gap: var(--sp-3);
      max-width: 1120px; margin: 0 auto;
      padding: 12px var(--sp-4);
    }
    @media (max-width: 640px) { .nav-inner { padding-inline: var(--sp-3); } }
    .brand {
      display: flex; align-items: center; gap: var(--sp-3);
      text-decoration: none; min-height: 44px;
    }
    .brand img { height: 30px; width: auto; display: block; }
    .brand-label {
      font-family: var(--font-mono);
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-secondary);
      padding-left: var(--sp-3);
      border-left: 1px solid var(--line);
      white-space: nowrap;
    }
    @media (max-width: 480px) { .brand-label { display: none; } }
    .nav-spacer { flex: 1; }
    .nav-admin {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 44px;
      padding: 0 var(--sp-2);
      font-size: 14px; font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--radius-ctl);
      white-space: nowrap;
      transition: color .12s, background .12s;
    }
    .nav-admin:hover { color: var(--primary); background: var(--bg-alt); }

    /* Hero — 簡化版，只留標題 */
    .hero {
      position: relative; overflow: hidden;
      color: #fff;
      padding-block: var(--sp-5);
      background:
        radial-gradient(ellipse 70% 60% at 50% 0%, rgba(106, 155, 183, 0.35) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(82, 97, 142, 0.28) 0%, transparent 70%),
        linear-gradient(180deg, #1a274a 0%, #233363 55%, #2a3d76 100%);
    }
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 78%);
              mask-image: radial-gradient(ellipse at center, black 35%, transparent 78%);
      pointer-events: none;
    }
    .hero-inner { position: relative; text-align: center; }
    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 12px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: rgba(246, 246, 246, 0.6);
      margin: 0 0 var(--sp-2);
    }
    .hero h1 {
      font-size: clamp(24px, 3.6vw, 32px);
      font-weight: 700; color: #fff;
      line-height: 1.3; letter-spacing: -0.5px;
      margin: 0;
    }

    /* 已結束的說明條 */
    .notice {
      margin: 0 0 var(--sp-3);
      padding: 12px var(--sp-3);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      border-left: 3px solid var(--primary-link);
      border-radius: var(--radius-ctl);
    }

    /* Form Wrapper */
    .form-section { padding-block: var(--sp-section) var(--sp-5); }
    .form-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .form-iframe-wrap { position: relative; background: #fff; }
    .form-iframe-wrap iframe {
      display: block; width: 100%; height: 1500px; border: 0;
      transition: height 0.2s ease;
    }
    .form-iframe-wrap .iframe-loader {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 2;
    }
    .form-iframe-wrap.is-loaded .iframe-loader { opacity: 0; }
    .iframe-loader-inner {
      display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
      color: var(--text-secondary); font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(35, 51, 99, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    /* 頁尾 */
    footer {
      background: var(--primary);
      color: rgba(246, 246, 246, 0.82);
      padding-block: var(--sp-5);
      font-size: 14px;
    }
    .footer-inner {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      gap: var(--sp-3) var(--sp-4);
      max-width: 1120px; margin: 0 auto; padding: 0 var(--sp-4);
    }
    @media (max-width: 640px) { .footer-inner { padding-inline: var(--sp-3); } }
    .footer-links { display: flex; flex-wrap: wrap; gap: 0 var(--sp-3); }
    .footer-links a {
      display: inline-flex; align-items: center; min-height: 44px;
      color: rgba(246, 246, 246, 0.78);
      text-decoration: underline; text-underline-offset: 3px;
    }
    .footer-links a:hover { color: #fff; }
    footer a:focus-visible { outline-color: #fff; }
  </style>
</head>
<body>

  <!-- 頁首 -->
  <header class="nav">
    <div class="nav-inner">
      <a href="../" class="brand" aria-label="知識遊牧工作室 活動報名中心 首頁">
        <img src="../assets/logo/wordmark-full.svg" alt="知識遊牧工作室" width="185" height="30">
        <span class="brand-label">Events</span>
      </a>
      <span class="nav-spacer"></span>
      <a href="https://docs.google.com/forms/d/17gPRh_BbOmnTzuIUtkjWrmCdhe-DQrQnVPYCLJDj9aM/edit#responses"
         target="_blank" rel="noopener noreferrer"
         class="nav-admin" title="後台 — 需 Google 帳號權限才能進入">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        後台
      </a>
    </div>
  </header>

  <main>
  <!-- Hero (minimal) -->
  <div class="hero">
    <div class="container hero-inner">
      <p class="hero-eyebrow">Survey · 已結束</p>
      <h1>意願調查：Claude Code AI 陪跑課</h1>
    </div>
  </div>

  <!-- Form -->
  <section class="form-section">
    <div class="container">
      <p class="notice">
        這份調查對應原訂 2026 年 7–8 月的課程，時間已過。新的場次會公告在
        <a href="../#events">活動報名中心</a>。
      </p>
      <div class="form-card">
        <div class="form-iframe-wrap" id="iframeWrap">
          <div class="iframe-loader">
            <div class="iframe-loader-inner">
              <div class="spinner"></div>
              <span>載入問卷中⋯</span>
            </div>
          </div>
          <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLSeJ-lIFlyer3qLbppWCjoOCjB-utB8Vj_TzDjXyzUJr5WMQjQ/viewform?embedded=true"
            width="100%"
            height="1500"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            id="formFrame"
            title="意願調查：Claude Code AI 陪跑課（Google 表單）">
            載入中⋯ 若沒有顯示，請
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeJ-lIFlyer3qLbppWCjoOCjB-utB8Vj_TzDjXyzUJr5WMQjQ/viewform" target="_blank" rel="noopener">點此開啟問卷</a>。
          </iframe>
        </div>
      </div>
    </div>
  </section>
  </main>

  <!-- 頁尾 -->
  <footer>
    <div class="footer-inner">
      <div>© 2026 知識遊牧工作室 · 活動報名中心</div>
      <nav class="footer-links" aria-label="頁尾連結">
        <a href="../">活動報名中心</a>
        <a href="https://knowmad.tw/" target="_blank" rel="noopener">官網</a>
        <a href="https://knowmad.tw/contact-us/" target="_blank" rel="noopener">聯絡我們</a>
      </nav>
    </div>
  </footer>

  <script>
    const wrap = document.getElementById('iframeWrap');
    const frame = document.getElementById('formFrame');
    frame.addEventListener('load', () => {
      wrap.classList.add('is-loaded');
      setTimeout(() => {
        const loader = wrap.querySelector('.iframe-loader');
        if (loader) loader.style.display = 'none';
      }, 500);
    });
    setTimeout(() => {
      wrap.classList.add('is-loaded');
      const loader = wrap.querySelector('.iframe-loader');
      if (loader) loader.style.display = 'none';
    }, 3000);

    // Best-effort dynamic resize：聽 Google 是否送高度事件（現在不一定有）
    // 之後 Google 若加上 postMessage 高度通知，這段會自動生效
    window.addEventListener('message', (e) => {
      if (!/^https:\/\/(docs|forms)\.google\.com$/.test(e.origin)) return;
      const data = e.data;
      let h = null;
      if (typeof data === 'object' && data) {
        h = data.height || data.iframeHeight || (data.params && data.params.height);
      } else if (typeof data === 'string') {
        const match = data.match(/"height":\s*(\d+)/);
        if (match) h = parseInt(match[1], 10);
      }
      if (h && h > 400 && h < 5000) {
        frame.style.height = h + 'px';
      }
    });
  </script>

</body>
</html>
